const areas = [...new Set(DATA.map(d => d.omraade))].sort();
let activeArea = 'alle';
let addedOrgs = JSON.parse(localStorage.getItem('addedOrgs') || '{}');

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

function copyText(text, btn) {
  navigator.clipboard.writeText(text);
  btn.classList.add('copied');
  btn.textContent = 'Kopiert!';
  showToast('Kopiert: ' + text);
  setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '📋 Kopier'; }, 1200);
}

function searchGoogle(name, type) {
  const q = type === 'person'
    ? encodeURIComponent(name + ' adresse')
    : encodeURIComponent(name + ' sameie adresse');
  window.open('https://www.google.com/search?q=' + q, '_blank');
}

function search1881(name) {
  window.open('https://www.1881.no/?query=' + encodeURIComponent(name), '_blank');
}

function renderFilters() {
  const el = document.getElementById('filters');
  const counts = { alle: DATA.length };
  areas.forEach(a => { counts[a] = DATA.filter(d => d.omraade === a).length; });
  el.innerHTML = `<button class="filter-chip ${activeArea === 'alle' ? 'active' : ''}" onclick="setArea('alle')">Alle (${counts.alle})</button>` +
    areas.map(a => `<button class="filter-chip ${activeArea === a ? 'active' : ''}" onclick="setArea('${a}')">${a} (${counts[a]})</button>`).join('');
}

function setArea(a) { activeArea = a; renderFilters(); render(); }

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = DATA.filter(d => {
    const matchArea = activeArea === 'alle' || d.omraade === activeArea;
    const matchSearch = !q || d.styreleder.toLowerCase().includes(q) || d.navn.toLowerCase().includes(q) || d.omraade.toLowerCase().includes(q) || d.adresse.toLowerCase().includes(q);
    return matchArea && matchSearch;
  });

  const addedCount = Object.keys(addedOrgs).length;
  document.getElementById('stats').innerHTML = `Viser <span>${filtered.length}</span> av ${DATA.length} | Lagt til: <span style="color:#22c55e">${addedCount}</span>`;

  const el = document.getElementById('list');
  el.innerHTML = filtered.map((d, i) => {
    const isAdded = addedOrgs[d.orgnr];
    const postnr = d.postnr.replace('.0', '').padStart(4, '0');
    const birthYear = d.fodselsdato ? d.fodselsdato.split('-')[0] : '';
    const savedUnits = addedOrgs[d.orgnr]?.units || '';
    const savedAddress = addedOrgs[d.orgnr]?.address || '';
    return `
      <div class="card ${isAdded ? 'added' : ''}" id="card-${d.orgnr}">
        <div class="card-top">
          <div style="flex:1;min-width:0">
            <div class="org-name">${d.navn}</div>
            <div class="org-address">${d.adresse}, ${postnr} ${d.poststed}</div>
            <div class="org-meta">
              <span class="area-badge">${d.omraade}</span>
              <span>${d.type}</span>
              <span>Stiftet ${d.stiftelsesdato}</span>
            </div>
          </div>
        </div>
        <div class="chairman">
          <div class="chairman-label">Styreleder</div>
          <div class="chairman-name">
            ${d.styreleder}
            <button class="copy-btn" onclick="copyText('${d.styreleder.replace(/'/g, "\\'")}', this)">📋 Kopier</button>
          </div>
          <div class="chairman-birth">Født: ${d.fodselsdato} (${birthYear})</div>
        </div>
        <div class="actions">
          <a class="search-google" onclick="search1881('${d.styreleder.replace(/'/g, "\\'")}')">🔍 1881.no</a>
          <a class="search-google" onclick="searchGoogle('${d.styreleder.replace(/'/g, "\\'")}', 'person')">🔍 Google person</a>
          <a class="search-google" onclick="searchGoogle('${d.navn.replace(/'/g, "\\'")}', 'org')">🔍 Google sameie</a>
          <button class="copy-btn" onclick="copyText('${d.orgnr.replace('.0', '')}', this)">Orgnr: ${d.orgnr.replace('.0', '')}</button>
        </div>
        <div class="units-input">
          <label>🏢 Enheter:</label>
          <input type="number" id="units-${d.orgnr}" placeholder="?" value="${savedUnits}" onchange="saveUnits('${d.orgnr}', this.value)">
          <label style="margin-left:8px">📍 Adresse:</label>
        </div>
        <input type="text" class="address-input" id="addr-${d.orgnr}" placeholder="Skriv riktig adresse til sameiet..." value="${savedAddress}" onchange="saveAddress('${d.orgnr}', this.value)">
        <div style="margin-top:10px;display:flex;gap:8px;align-items:center">
          <button class="add-btn ${isAdded ? 'added' : ''}" id="btn-${d.orgnr}" onclick="toggleAdd('${d.orgnr}')">
            ${isAdded ? '✓ Lagt til' : 'Legg til i Turbo'}
          </button>
          ${isAdded ? '<span style="font-size:11px;color:#22c55e;font-weight:600">Klar for import</span>' : ''}
        </div>
      </div>
    `;
  }).join('');
}

function saveUnits(orgnr, val) {
  if (!addedOrgs[orgnr]) addedOrgs[orgnr] = {};
  addedOrgs[orgnr].units = val;
  localStorage.setItem('addedOrgs', JSON.stringify(addedOrgs));
}

function saveAddress(orgnr, val) {
  if (!addedOrgs[orgnr]) addedOrgs[orgnr] = {};
  addedOrgs[orgnr].address = val;
  localStorage.setItem('addedOrgs', JSON.stringify(addedOrgs));
}

const API_BASE = 'https://kombo-ecru.vercel.app';
const KERIM_USER_ID = 'cmpdvll6k0002lb04kiwtmzrx';
const IMPORT_KEY = 'turbo-import-2026';

async function toggleAdd(orgnr) {
  if (addedOrgs[orgnr]?.added) {
    delete addedOrgs[orgnr].added;
    if (!addedOrgs[orgnr].units && !addedOrgs[orgnr].address) delete addedOrgs[orgnr];
    localStorage.setItem('addedOrgs', JSON.stringify(addedOrgs));
    render();
    return;
  }

  const org = DATA.find(d => d.orgnr === orgnr);
  if (!org) return;

  const units = document.getElementById('units-' + orgnr)?.value;
  const addr = document.getElementById('addr-' + orgnr)?.value;
  const birthYear = org.fodselsdato ? org.fodselsdato.split('-')[0] : '';

  const btn = document.getElementById('btn-' + orgnr);
  btn.disabled = true;
  btn.textContent = 'Legger til...';

  try {
    const res = await fetch(API_BASE + '/api/public/import-org', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        key: IMPORT_KEY,
        name: org.navn,
        address: addr || org.adresse,
        postalCode: org.postnr.replace('.0', '').padStart(4, '0'),
        city: org.poststed,
        numUnits: units ? parseInt(units, 10) : 1,
        chairmanName: org.styreleder,
        chairmanBirthNumber: birthYear,
        assignToUserId: KERIM_USER_ID,
        notes: 'Importert fra styreleder-liste. Område: ' + org.omraade,
      }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || 'Kunne ikke opprette');
    }
    const data = await res.json();

    if (!addedOrgs[orgnr]) addedOrgs[orgnr] = {};
    addedOrgs[orgnr].added = true;
    addedOrgs[orgnr].turboId = data.id;
    addedOrgs[orgnr].geocoded = data.geocoded;
    if (units) addedOrgs[orgnr].units = units;
    if (addr) addedOrgs[orgnr].address = addr;
    localStorage.setItem('addedOrgs', JSON.stringify(addedOrgs));
    showToast(data.geocoded ? 'Lagt til og tildelt Kerim!' : 'Lagt til (mangler koordinater)');
  } catch (e) {
    showToast('Feil: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Legg til i Turbo';
    return;
  }
  render();
}

document.getElementById('search').addEventListener('input', render);
renderFilters();
render();
</script>
